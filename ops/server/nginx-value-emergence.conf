server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/value-emergence/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name jiazhiyongxian.cn www.jiazhiyongxian.cn;
    server_tokens off;
    return 301 https://jiazhiyongxian.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jiazhiyongxian.cn;

    root /var/www/value-emergence/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/jiazhiyongxian.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiazhiyongxian.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jiazhiyongxian.cn;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/jiazhiyongxian.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiazhiyongxian.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://jiazhiyongxian.cn$request_uri;
}
